# EXAMPLE overlay: both retire at 55, with private health premiums until Medicare.
#   plan run -f scenarios/examples/base.yaml -f scenarios/examples/retire_at_55.yaml
# Overlays are partial configs: list items deep-merge by id, scalars replace.
meta:
  name: example-retire-at-55

household:
  people:
    - { name: sam, retirement_age: 55 }
    - { name: riley, retirement_age: 55 }

expenses:
  # Pre-Medicare bridge; flag `aca: true` to model the ACA premium tax credit
  - { id: pre-medicare-health, annual: 22000, start: retirement, end: "age:sam:65" }
