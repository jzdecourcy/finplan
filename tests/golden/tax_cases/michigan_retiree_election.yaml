name: michigan-retiree-election
source: >-
  RAB 2026-1 + Form 446 (2026): MFJ both 68, IRA distributions 150,000, SS 40,000.
  Federal: provisional 170,000 -> taxable SS = min(85% x 40,000, ...) = 34,000; AGI
  184,000. MI method 1: 34,000 SS + min(150,000, cap 135,220) = 169,220 subtractions
  + 11,800 exemptions -> taxable 2,980 -> tax 126.65. Method 2 (senior std): 34,000 +
  (40,000 - 11,800) = 62,200 -> taxable 110,000 -> 4,675. Method 1 wins.
params_year: 2026
state: michigan
input:
  filing_status: mfj
  ages: { p0: 68, p1: 68 }
  traditional_distributions: 150000
  ss_benefits: 40000
