# SSA national Average Wage Index (AWI) series and PIA bend-point formula bases.
# Used by finplan.ss.pia to recompute a Primary Insurance Amount from an earnings
# history (wage-index earnings, top-35 AIME, 90/32/15 bend-point formula).
#
# Data-file rule: values change only with a cited primary source and passing golden
# tests (tests/unit/test_ss_pia.py holds the SSA published worked example).

sources:
  - name: "SSA, National Average Wage Index"
    url: https://www.ssa.gov/oact/cola/AWI.html
    accessed: 2026-09-04
    note: >
      Full AWI series 1951-2024. Latest index (2024) = 69,846.57 (+4.84% over 2023).
      Earnings are indexed to the AWI two years before the year of first eligibility
      (age 62); earnings in or after the age-60 year are taken at face value.
  - name: "SSA, Benefit Formula Bend Points"
    url: https://www.ssa.gov/oact/cola/bendpoints.html
    accessed: 2026-09-04
    note: >
      1979 PIA formula dollar amounts $180/$1,085, indexed by AWI(Y-2)/AWI(1977) and
      rounded to the nearest dollar. Published table used as golden values
      (1979: 180/1085; 2021: 996/6002; 2026: 1286/7749).
  - name: "SSA, Benefit Calculation Examples for Workers Retiring in 2026"
    url: https://www.ssa.gov/oact/ProgData/retirebenefit1.html
    accessed: 2026-09-04
    note: >
      Case A (born 1964, retires at 62 in 2026): AIME $5,825 -> PIA $2,609.80.
      Golden test source, incl. the full 1986-2025 nominal earnings history.

# Statutory PIA formula structure (1977 amendments; stable law, like claim factors):
bend_point_bases_1979: [180, 1085]
pia_rates: [0.90, 0.32, 0.15]

