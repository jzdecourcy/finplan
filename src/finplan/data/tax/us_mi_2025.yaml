# Michigan individual income tax parameters, TAX YEAR 2025. Verified against primary
# sources 2026-09-11 — see `sources`. Do not edit without a cited source + green tests.
# Added for the 2025 filed-return reconciliation; structure mirrors us_mi_2026.yaml.
year: 2025

rate: 0.0425                  # MI-1040 (2025) line 17: "Multiply line 16 by 4.25%"
personal_exemption: 5800      # MI-1040 (2025) line 9a: "x $5,800"

# PA 4 of 2023 phase-in, year 3 of 4: the subtraction is 75% of the private pension
# limits, and in 2025 it is available ONLY to filers (oldest spouse) born 1946-1966.
# The engine applies the cap by age alone (no birth-year gate); for a household born
# after 1966 that overstates the 2025 subtraction. Full phase-in (everyone) is 2026.
retirement_subtraction:
  cap_single: 49423
  cap_mfj: 98846
  min_age: 59.5

# Tier 3 Michigan Standard Deduction (born after 1952, age 67+): 2025 Form 4884
# Worksheet 3.1 maximum $20,000 single / $40,000 joint. For 2025 (pre-PA 24 of 2025)
# it is still reduced by any Social Security subtraction — the engine's 2026 stacking
# treatment is not exact for 2025 but no 2025 filer in this household is 67+.
senior_standard_deduction:
  single: 20000
  mfj: 40000
  min_age: 67

mesp_529_deduction:           # 2025 Schedule 1 instructions, line 17
  single: 5000
  mfj: 10000

sources:
  - "2025 MI-1040 form (rate 4.25% line 17; exemption $5,800 line 9a): https://www.michigan.gov/taxes/-/media/Project/Websites/taxes/Forms/IIT/TY2025/MI-1040.pdf"
  - "Michigan Treasury, 2025 Tier III / Phase-In Subtraction page ('For 2025 those amounts are $49,423 if single or married filing separately, $98,846 if married filing jointly'; 75% of private pension limits; born 1946-1966): https://www.michigan.gov/taxes/iit/tax-guidance/tax-situations/retirement-and-pension-benefits/2025/2025-tier-iii"
  - "2025 Form 4884 (Worksheet 3.1 maximum $20,000 single / $40,000 joint): https://www.michigan.gov/taxes/-/media/Project/Websites/taxes/Forms/IIT/TY2025/4884.pdf"
  - "2025 MI Schedule 1 instructions (529 line 17 cap): https://www.michigan.gov/taxes/-/media/Project/Websites/taxes/Forms/IIT/TY2025/Schedule-1-Instr.pdf"
  - "Verified 2026-09-11: figures read from the michigan.gov pages in a browser session and from the filed 2025 MI-1040"
